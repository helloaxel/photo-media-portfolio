<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Nightwalk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/project_pages.css">
    <script>
        {
            const saved = localStorage.getItem('theme');
            if (saved) document.documentElement.setAttribute('data-theme', saved);
        }
    </script>
</head>


<body>

    <header>
        <nav>
            <button class="home-btn" type="button" width="40" height="40"></button>
            <button class="toggle-mode" type="button">
                <span role="button" aria-label="sun" width="40" height="40">&#9788;</span>
            </button>
        </nav>
    </header>

    <div class="title-vertical" role="contentinfo">

        <h1>Nightwalk</h1>

        <em>Teenage longexposure adventure, 2017</em> <br><br>
        <p>
            A tripod with a cable release, sometimes a friend, and wandering around the city after midnight.
        </p>

    </div>

    <div class="gallery project-page-vertical has-lightbox" role="list" aria-label="project-nightwalk content">

        <figure class="gallery-p11" id="p11-i1" role="listitem">
            <picture>
                <source type="image/webp"
                    srcset="../assets/images/optimizadas/personal-projects/Nightwalk/Nightwalk_01.webp 1032w">
                <img src="../assets/images/optimizadas/personal-projects/Nightwalk/Nightwalk_01.jpg"
                    srcset="../assets/images/optimizadas/personal-projects/Nightwalk/Nightwalk_01.jpg 1032w"
                    sizes="(max-width:915px) 60vw, (max-width:1200px) 30vw, 457px" alt="Nightwalk 01" loading="lazy"
                    width="1032" height="1600">
            </picture>
        </figure>

        <figure class="gallery-p11" id="p11-i2" role="listitem">
            <picture>
                <source type="image/webp"
                    srcset="../assets/images/optimizadas/personal-projects/Nightwalk/Nightwalk_02.webp 1040w">

                    srcset="../assets/images/optimizadas/personal-projects/Nightwalk/Nightwalk_02.jpg 1040w"
                    sizes="(max-width:915px) 60vw, (max-width:1200px) 30vw, 457px" alt="Nightwalk 02" loading="lazy"
                    width="1040" height="1600">
            </picture>
        </figure>

        <figure class="gallery-p11" id="p11-i3" role="listitem">
            <picture>
                <source type="image/webp"
                    srcset="../assets/images/optimizadas/personal-projects/Nightwalk/Nightwalk_03.webp 1920w">
                <img src="../assets/images/optimizadas/personal-projects/Nightwalk/Nightwalk_03.jpg"
                    srcset="../assets/images/optimizadas/personal-projects/Nightwalk/Nightwalk_03.jpg 1920w"
                    sizes="(max-width:915px) 60vw, (max-width:1200px) 30vw, 457px" alt="Nightwalk 03" loading="lazy"

            </picture>
        </figure>

        <figure class="gallery-p11" id="p11-i4" role="listitem">
            <picture>
                <source type="image/webp"
                    srcset="../assets/images/optimizadas/personal-projects/Nightwalk/Nightwalk_04.webp 1920w">
                <img src="../assets/images/optimizadas/personal-projects/Nightwalk/Nightwalk_04.jpg"
                    srcset="../assets/images/optimizadas/personal-projects/Nightwalk/Nightwalk_04.jpg 1920w"
                    sizes="(max-width:915px) 60vw, (max-width:1200px) 30vw, 457px" alt="Nightwalk 04" loading="lazy"
                    width="1920" height="2874">
            </picture>
        </figure>

        <figure class="gallery-p11" id="p11-i5" role="listitem">
            <picture>
                <source type="image/webp"
                    srcset="../assets/images/optimizadas/personal-projects/Nightwalk/Nightwalk_05.webp 1920w">

                    sizes="(max-width:915px) 60vw, (max-width:1200px) 30vw, 457px" alt="Nightwalk 05" loading="lazy"
                    width="1920" height="2908">

    </div>


    <div class="lightbox" id="lightbox">
        <img id="lightbox-img" src="" alt="">
    </div>

    <script src="../js/main.js"></script>
