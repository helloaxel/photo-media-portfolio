<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Snapshots</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/project_pages.css">
    <script>
        {
            const saved = localStorage.getItem('theme');
            if (saved) document.documentElement.setAttribute('data-theme', saved);
        }
    </script>
</head>


<body>

    <header>
        <nav>
            <button class="home-btn" type="button" width="40" height="40"></button>
            <button class="toggle-mode" type="button">
                <span role="button" aria-label="sun" width="40" height="40">&#9788;</span>
            </button>
        </nav>
    </header>

    <div class="title-horizontal" role="contentinfo">

        <h1>Snapshots</h1>

        <p>Spontaneous sight-seeing</p>

    </div>

    <div class="gallery project-page-horizontal has-lightbox" role="list" aria-label="project-snapshots content">

        <figure class="gallery-p9" id="p9-i1" role="listitem">
            <picture>
                <source type="image/webp"
                    srcset="../assets/images/optimizadas/personal-projects/Snapshots/snapshot_00.webp 1794w">
                <img src="../assets/images/optimizadas/personal-projects/Snapshots/snapshot_00.jpg"
                    srcset="../assets/images/optimizadas/personal-projects/Snapshots/snapshot_00.jpg 1794w"
                    sizes="(max-width:915px) 60vw, (max-width:1200px) 30vw, 457px" alt="Snapshots 01" loading="lazy"
                    width="1794" height="2697">
            </picture>
        </figure>

        <figure class="gallery-p9" id="p9-i2" role="listitem">
            <picture>
                <source type="image/webp"
                    srcset="../assets/images/optimizadas/personal-projects/Snapshots/snapshot_01.webp 1830w">
                <img src="../assets/images/optimizadas/personal-projects/Snapshots/snapshot_01.jpg"
                    srcset="../assets/images/optimizadas/personal-projects/Snapshots/snapshot_01.jpg 1830w"
                    sizes="(max-width:915px) 60vw, (max-width:1200px) 30vw, 457px" alt="Snapshots 02" loading="lazy"
                    width="1830" height="2751">
            </picture>
        </figure>

        <figure class="gallery-p9" id="p9-i3" role="listitem">
            <picture>
                <source type="image/webp"
                    srcset="../assets/images/optimizadas/personal-projects/Snapshots/snapshot_02.webp 1920w">
                <img src="../assets/images/optimizadas/personal-projects/Snapshots/snapshot_02.jpg"
                    srcset="../assets/images/optimizadas/personal-projects/Snapshots/snapshot_02.jpg 1920w"
                    sizes="(max-width:915px) 60vw, (max-width:1200px) 30vw, 480px" alt="Snapshots 03" loading="lazy"
                    width="1920" height="1240">
            </picture>
        </figure>


        <figure class="gallery-p9" id="p9-i4" role="listitem">
            <picture>
                <source type="image/webp"
                    srcset="../assets/images/optimizadas/personal-projects/Snapshots/snapshot_03.webp 1920w">
                <img src="../assets/images/optimizadas/personal-projects/Snapshots/snapshot_03.jpg"
                    srcset="../assets/images/optimizadas/personal-projects/Snapshots/snapshot_03.jpg 1920w"
                    sizes="(max-width:915px) 60vw, (max-width:1200px) 30vw, 480px" alt="Snapshots 04" loading="lazy"
                    width="1920" height="1370">
            </picture>
        </figure>

        <figure class="gallery-p9" id="p9-i5" role="listitem">
            <picture>
                <source type="image/webp" srcset="../assets/images/optimizadas/portraits/portrait_026.webp 1920w">
                <img src="../assets/images/optimizadas/portraits/portrait_026.jpg"
                    srcset="../assets/images/optimizadas/portraits/portrait_026.jpg 1920w"
                    sizes="(max-width:915px) 60vw, (max-width:1200px) 30vw, 457px" alt="Snapshots 05" loading="lazy"
                    width="1920" height="2866">
            </picture>
        </figure>

    </div>

    <div class="lightbox" id="lightbox">
        <img id="lightbox-img" src="" alt="">
    </div>



    <script src="../js/main.js"></script>

</body>

</html>
